# Local development only (security disabled).
services:
  elasticsearch:
    # Keep the major version in line with the installed Python client.
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.1}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  esdata:
